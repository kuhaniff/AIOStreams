name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Force Clean and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Padam fail binary yang bermasalah
          rm -f packages/frontend/public/assets/background.png
          rm -f packages/frontend/src/app/icon.ico
          
          # 2. Buang sejarah Git lama untuk hilangkan kesan fail binary
          rm -rf .git
          
          # 3. Setup Git baru yang bersih
          git init
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add .
          git commit -m "Initial clean build for Hugging Face"
          git branch -M main
          
          # 4. Paksa hantar ke Hugging Face
          git push --force https://kunepp:$HF_TOKEN@huggingface.co/spaces/kunepp/aiostream main
