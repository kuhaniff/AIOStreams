name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Remove problematic binary files
        run: |
          rm -f packages/frontend/public/assets/background.png
          rm -f packages/frontend/src/app/icon.ico
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add .
          git commit -m "Remove binary files for HF sync" || echo "No changes to commit"
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://kunepp:$HF_TOKEN@huggingface.co/spaces/kunepp/aiostream main
